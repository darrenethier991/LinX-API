<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="LinX"/>
  <meta property="og:title" content="Contractor Profile — LinX"/>
  <meta property="og:description" content="View a LinX contractor profile — trade, service area, and contact."/>
  <meta property="og:url" content="https://linxservices.ca/contractor-profile.html"/>
  <meta property="og:image" content="https://linxservices.ca/og-image.jpg"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="description" content="View a LinX contractor profile — trade, service area, and contact."/>
  <title>Contractor Profile — LinX</title>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__dot"></span>
      <span class="brand__text">LinX</span>
    </a>
    <button class="topbar__toggle" id="nav-toggle" aria-expanded="false" aria-controls="topbar-nav">☰</button>
    <nav class="topbar__nav" id="topbar-nav">
      <a href="index.html">Home</a>
      <a href="find-contractors.html" class="active">Find Contractors</a>
      <a href="jobs.html">Job Board</a>
      <a href="pricing.html">For Contractors</a>
      <a href="contact.html">Contact</a>
      <a href="post-job.html" class="btn btn--gold btn--sm">Post a Job — Free</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="shell" style="max-width:900px;">

    <a href="find-contractors.html" style="display:inline-flex;align-items:center;gap:.4rem;color:var(--white-35);font-size:.83rem;text-decoration:none;margin-bottom:1.5rem;">← Back to Find Contractors</a>

    <!-- Profile (rendered by JS) -->
    <div id="profile-root"></div>

    <!-- Not found state -->
    <div id="profile-missing" style="display:none;text-align:center;padding:3rem;color:var(--white-35);">
      <div style="font-size:3rem;margin-bottom:.8rem;">🔍</div>
      <div style="font-family:var(--font-head);font-size:1rem;color:var(--white-60);margin-bottom:.4rem;">Contractor not found</div>
      <div style="font-size:.85rem;"><a href="find-contractors.html">Browse all contractors</a> instead.</div>
    </div>

  </div>
</section>

<footer class="footer">
  <div class="shell">
    <div class="footer__legal" style="border-top:none;padding-top:0;">
      <span>© <span class="js-year">2026</span> LinX · Darren Ethier, Sole Proprietor · Barrie, Ontario</span>
      <span><a href="index.html" style="color:inherit;">Home</a> · <a href="post-job.html" style="color:inherit;">Post a Job</a></span>
    </div>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
  if (typeof CONTRACTORS === 'undefined') {
    document.getElementById('profile-root').innerHTML =
      '<div class="card" style="color:var(--red);">⚠️ <strong>js/app.js failed to load.</strong> Deploy the full site folder (css/, js/, and all .html files) with the structure intact.</div>';
    throw new Error('[LinX:E-ASSET-404] js/app.js not loaded — CONTRACTORS unavailable. Verify /js/app.js exists at the deployed root.');
  }
  const id = new URLSearchParams(window.location.search).get('id');
  const c = CONTRACTORS.find(x => x.id === id);

  if (!c) {
    document.getElementById('profile-missing').style.display = 'block';
  } else {
    document.title = `${c.name} — ${c.trade} in ${c.city} | LinX`;
    document.getElementById('profile-root').innerHTML = `

      <!-- Hero card -->
      <div class="card card--accent" style="margin-bottom:1.2rem;">
        <div style="display:flex;flex-wrap:wrap;gap:1.6rem;align-items:flex-start;">
          <div style="text-align:center;flex-shrink:0;">
            <div style="position:relative;display:inline-block;margin-bottom:.5rem;">
              <div class="contractor-avatar" style="width:90px;height:90px;font-size:2rem;">${c.initials}</div>
              ${c.online ? '<span class="online-dot" style="position:absolute;bottom:4px;right:4px;width:14px;height:14px;"></span>' : ''}
            </div>
            <div style="font-size:.75rem;color:${c.online ? 'var(--green)' : 'var(--white-35)'};">${c.online ? '● Online now' : 'Offline'}</div>
          </div>

          <div style="flex:1;min-width:200px;">
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.3rem;">
              <h1 style="font-family:var(--font-head);font-size:1.6rem;font-weight:700;margin:0;">${c.name}</h1>
              ${c.verified ? '<span class="tag tag--blue">✓ Verified</span>' : ''}
              ${c.tags.includes('Insured') ? '<span class="tag" style="color:#6EE7B7;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);">🛡 Insured</span>' : ''}
            </div>
            <div style="font-size:1rem;color:var(--gold);font-weight:600;margin-bottom:.4rem;">${c.trade}</div>
            <div style="display:flex;flex-wrap:wrap;gap:1rem;font-size:.83rem;color:var(--white-35);">
              <span>📍 ${c.city}, ON</span>
              <span>🔨 ${c.jobs} jobs done</span>
              <span>📅 Member since ${c.since}</span>
            </div>
          </div>

          <div style="text-align:right;flex-shrink:0;">
            <div style="font-size:1.8rem;font-weight:700;font-family:var(--font-head);color:var(--gold-bright);">${c.rating}</div>
            <div style="font-size:.88rem;color:var(--white-60);margin-bottom:.2rem;">${starString(c.rating)} · ${c.reviews} reviews</div>
            <div style="font-size:.78rem;color:var(--white-35);">Avg. <span style="color:var(--gold-bright);font-weight:700;">$${c.rate}</span>/hr</div>
          </div>
        </div>

        <div style="border-top:1px solid var(--border);margin:1.2rem 0;"></div>

        <div style="margin-bottom:1rem;">
          <div class="eyebrow" style="margin-bottom:.5rem;">About</div>
          <p style="font-size:.88rem;color:var(--white-60);line-height:1.7;margin:0;">${c.bio}</p>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem;">
          ${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:.6rem;">
          <a class="btn btn--gold" href="post-job.html?trade=${encodeURIComponent(c.trade)}">📋 Request a Quote</a>
          <a class="btn btn--outline" href="find-contractors.html">Browse More Contractors</a>
        </div>
      </div>

      <!-- Stats row (all from platform data — nothing invented) -->
      <div class="grid-4" style="margin-bottom:1.2rem;">
        <div class="stat-widget"><div class="stat-widget__value">${c.jobs}</div><div class="stat-widget__label">Jobs Done</div></div>
        <div class="stat-widget"><div class="stat-widget__value">${c.rating}</div><div class="stat-widget__label">Avg Rating</div></div>
        <div class="stat-widget"><div class="stat-widget__value">${c.reviews}</div><div class="stat-widget__label">Reviews</div></div>
        <div class="stat-widget"><div class="stat-widget__value">${c.resp}</div><div class="stat-widget__label">Responds In</div></div>
      </div>

      <!-- Service area -->
      <div class="card" style="margin-bottom:1.2rem;">
        <div class="eyebrow" style="margin-bottom:.8rem;">📍 Service Area</div>
        <div style="display:flex;flex-wrap:wrap;gap:.4rem;">
          ${c.area.map(a => `<span class="tag tag--gold">${a}</span>`).join('')}
        </div>
        <div style="font-size:.78rem;color:var(--white-35);margin-top:.8rem;">Usually responds within ${c.resp.toLowerCase().replace('< ', '')}. Reviews and job history sync from the LinX platform.</div>
      </div>

      <!-- Quote CTA -->
      <div class="cta-band">
        <h2 class="section-title" style="font-size:1.3rem;margin-bottom:.5rem;">Want a quote from ${c.name}?</h2>
        <p class="section-sub" style="margin:0 auto 1.4rem;">Post your job free — ${c.name.split(' ')[0]} and other matched ${c.trade.toLowerCase()} pros in ${c.city} will be notified instantly.</p>
        <a href="post-job.html?trade=${encodeURIComponent(c.trade)}" class="btn btn--gold btn--lg">Post a Job — Free</a>
      </div>
    `;
  }
</script>
</body>
</html>
