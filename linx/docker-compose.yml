# LinX platform — local development stack (LEGACY FLAT LAYOUT)
# Canonical path is now platform/ + services/ (see platform/docker-compose.yml and updated root Makefile).
# Usage from root: `make up` (delegates). Or cd platform && cp env/.env.example env/.env → make keys → make up → make migrate
# This file kept for backward compat with flat module sources; prefer the platform compose for web + structured services.

name: linx

x-jwt-env: &jwt-env
  JWT_ISSUER: ${JWT_ISSUER:-http://identity:8081}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-linx-api}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linxdev}
      POSTGRES_DB: linx
    ports:
      - "5432:5432"
    volumes:
      - linx-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linx} -d linx"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linx-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - linx-net

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || nc -z localhost 4222"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - linx-net

  identity:
    build:
      context: ./linx-identity
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://linx:linxdev@postgres:5432/linx_identity?sslmode=disable
      HTTP_PORT: "8081"
      LOG_LEVEL: debug
      <<: *jwt-env
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_KEY_ID: linx-identity-1
    volumes:
      - ./docker/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linx-net

  hub:
    build:
      context: .
      dockerfile: linx-hub/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://linx:linxdev@postgres:5432/linx_hub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_JWKS_URL: http://identity:8081/.well-known/jwks.json
      HTTP_PORT: "8082"
      LOG_LEVEL: info
      <<: *jwt-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - linx-net

  vault:
    build:
      context: .
      dockerfile: linx-vault/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://linx:linxdev@postgres:5432/linx_vault?sslmode=disable
      JWT_JWKS_URL: http://identity:8081/.well-known/jwks.json
      VAULT_MASTER_KEY_ID: dev-mk-1
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtcGFkZGVkISE=}
      HTTP_PORT: "8083"
      LOG_LEVEL: info
      <<: *jwt-env
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - linx-net

  connect:
    build:
      context: .
      dockerfile: linx-connect/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://linx:linxdev@postgres:5432/linx_connect?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_JWKS_URL: http://identity:8081/.well-known/jwks.json
      HUB_URL: http://hub:8082
      HTTP_PORT: "8084"
      LOG_LEVEL: info
      <<: *jwt-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      hub:
        condition: service_started
    networks:
      - linx-net

  flow:
    build:
      context: .
      dockerfile: linx-flow/Dockerfile
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://linx:linxdev@postgres:5432/linx_flow?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_JWKS_URL: http://identity:8081/.well-known/jwks.json
      HUB_URL: http://hub:8082
      LENS_URL: http://lens:8086
      CONNECT_URL: http://connect:8084
      HTTP_PORT: "8085"
      LOG_LEVEL: info
      <<: *jwt-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      hub:
        condition: service_started
      connect:
        condition: service_started
    networks:
      - linx-net

  lens:
    build:
      context: ./linx-lens
      dockerfile: Dockerfile
    command: ["uvicorn", "linx_lens.api.routes:app", "--host", "0.0.0.0", "--port", "8086"]
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      IDENTITY_URL: http://identity:8081
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_PER_MINUTE: "60"
      LOG_LEVEL: debug
      LOG_PROMPTS: "false"
      HTTP_PORT: "8086"
      <<: *jwt-env
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - linx-net

  exchange:
    build:
      context: .
      dockerfile: linx-exchange/Dockerfile
    ports:
      - "8087:8087"
    environment:
      DATABASE_URL: postgres://linx:linxdev@postgres:5432/linx_exchange?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_JWKS_URL: http://identity:8081/.well-known/jwks.json
      HUB_URL: http://hub:8082
      FRAUD_AMOUNT_THRESHOLD_MINOR: ${FRAUD_AMOUNT_THRESHOLD_MINOR:-100000}
      DEBIT_ACCOUNT_ID: ${DEBIT_ACCOUNT_ID:-00000000-0000-0000-0000-000000000001}
      CREDIT_ACCOUNT_ID: ${CREDIT_ACCOUNT_ID:-00000000-0000-0000-0000-000000000002}
      HTTP_PORT: "8087"
      LOG_LEVEL: info
      <<: *jwt-env
      # Stripe billing (linx-exchange) - see root or platform .env.example
      LINX_STRIPE_SECRET_KEY: ${LINX_STRIPE_SECRET_KEY:-}
      LINX_STRIPE_WEBHOOK_SECRET: ${LINX_STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CORE_MONTHLY: ${STRIPE_PRICE_CORE_MONTHLY:-price_linx_core_monthly}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY:-price_linx_starter_monthly}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-price_linx_pro_monthly}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-price_linx_enterprise_monthly}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://linx.app/launchpad/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://linx.app/launchpad/cancel}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      hub:
        condition: service_started
    networks:
      - linx-net

  agents:
    build:
      context: ./linx-agents
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      IDENTITY_URL: http://identity:8081
      LENS_URL: http://lens:8086
      FLOW_URL: http://flow:8085
      VAULT_URL: http://vault:8083
      CONNECT_URL: http://connect:8084
      EXCHANGE_URL: http://exchange:8087
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      HTTP_PORT: "8088"
      <<: *jwt-env
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      lens:
        condition: service_started
      vault:
        condition: service_started
      flow:
        condition: service_started
      connect:
        condition: service_started
      exchange:
        condition: service_started
    networks:
      - linx-net

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      IDENTITY_URL: http://identity:8081
      HUB_URL: http://hub:8082
      VAULT_URL: http://vault:8083
      CONNECT_URL: http://connect:8084
      FLOW_URL: http://flow:8085
      LENS_URL: http://lens:8086
      EXCHANGE_URL: http://exchange:8087
      AGENTS_URL: http://agents:8088
      REDIS_URL: redis://redis:6379
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      <<: *jwt-env
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      hub:
        condition: service_started
      vault:
        condition: service_started
      connect:
        condition: service_started
      flow:
        condition: service_started
      lens:
        condition: service_started
      exchange:
        condition: service_started
      agents:
        condition: service_started
    networks:
      - linx-net

  # Full web integration - Next.js SaaS UI (Contractor, Launchpad, EchoForge Operator, Admin)
  # Uses design tokens. API client ready for gateway. Role/tier aware demo.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_started
    networks:
      - linx-net

volumes:
  linx-pgdata:

networks:
  linx-net:
    driver: bridge
